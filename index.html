<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock App</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Navigation -->
    <nav class="nav">
      <button class="nav-btn active" data-tab="clock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>Clock</span>
      </button>
      <button class="nav-btn" data-tab="alarm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span>Alarm</span>
      </button>
      <button class="nav-btn" data-tab="stopwatch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="13" r="8"/>
          <path d="M12 9v4l2 2"/>
          <path d="M5 3L2 6"/>
          <path d="M22 6l-3-3"/>
          <path d="M12 1v2"/>
        </svg>
        <span>Stopwatch</span>
      </button>
      <button class="nav-btn" data-tab="timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 2h4"/>
          <path d="M12 14v-4"/>
          <circle cx="12" cy="14" r="8"/>
        </svg>
        <span>Timer</span>
      </button>
      <button class="nav-btn" data-tab="worldclock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span>World Clock</span>
      </button>
    </nav>

    <!-- Tab Contents -->
    <main class="content">

      <!-- CLOCK TAB -->
      <section class="tab active" id="clock">
        <div class="clock-container">
          <div class="analog-clock">
            <div class="clock-face">
              <div class="clock-markers"></div>
              <div class="hand hour-hand" id="hourHand"></div>
              <div class="hand minute-hand" id="minuteHand"></div>
              <div class="hand second-hand" id="secondHand"></div>
              <div class="center-dot"></div>
            </div>
          </div>
          <div class="digital-time">
            <span id="digitalTime">00:00:00</span>
          </div>
          <div class="date-display">
            <span id="dateDisplay">Monday, January 1, 2024</span>
          </div>
        </div>
      </section>

      <!-- ALARM TAB -->
      <section class="tab" id="alarm">
        <div class="alarm-container">
          <div class="alarm-header">
            <h2>Alarms</h2>
            <button class="btn-add" id="addAlarmBtn" aria-label="Add alarm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>
          <div class="alarm-list" id="alarmList">
            <div class="empty-state" id="noAlarms">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <p>No alarms set</p>
              <span>Tap + to add an alarm</span>
            </div>
          </div>
        </div>

        <!-- Alarm Modal -->
        <div class="modal-overlay" id="alarmModal">
          <div class="modal">
            <h3 id="alarmModalTitle">Set Alarm</h3>
            <div class="time-picker">
              <div class="picker-col">
                <button class="picker-arrow up" data-target="alarmHour" data-dir="up">▲</button>
                <input type="text" id="alarmHour" value="07" maxlength="2" class="picker-input">
                <button class="picker-arrow down" data-target="alarmHour" data-dir="down">▼</button>
              </div>
              <span class="picker-sep">:</span>
              <div class="picker-col">
                <button class="picker-arrow up" data-target="alarmMinute" data-dir="up">▲</button>
                <input type="text" id="alarmMinute" value="00" maxlength="2" class="picker-input">
                <button class="picker-arrow down" data-target="alarmMinute" data-dir="down">▼</button>
              </div>
              <div class="picker-col ampm-col">
                <button class="picker-arrow up" data-target="alarmAmPm" data-dir="up">▲</button>
                <input type="text" id="alarmAmPm" value="AM" maxlength="2" class="picker-input ampm" readonly>
                <button class="picker-arrow down" data-target="alarmAmPm" data-dir="down">▼</button>
              </div>
            </div>
            <div class="alarm-label-row">
              <input type="text" id="alarmLabel" placeholder="Label (optional)" class="alarm-label-input" maxlength="30">
            </div>
            <div class="day-selector">
              <button class="day-btn" data-day="0">S</button>
              <button class="day-btn" data-day="1">M</button>
              <button class="day-btn" data-day="2">T</button>
              <button class="day-btn" data-day="3">W</button>
              <button class="day-btn" data-day="4">T</button>
              <button class="day-btn" data-day="5">F</button>
              <button class="day-btn" data-day="6">S</button>
            </div>
            <div class="alarm-sound-row">
              <label for="alarmSound">Sound</label>
              <select id="alarmSound">
                <option value="classic">Classic</option>
                <option value="digital">Digital</option>
                <option value="gentle">Gentle</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
            <div class="modal-actions">
              <button class="btn-cancel" id="cancelAlarm">Cancel</button>
              <button class="btn-save" id="saveAlarm">Save</button>
            </div>
          </div>
        </div>
      </section>

      <!-- STOPWATCH TAB -->
      <section class="tab" id="stopwatch">
        <div class="stopwatch-container">
          <div class="stopwatch-display">
            <span class="sw-time" id="swTime">00:00.00</span>
          </div>
          <div class="stopwatch-controls">
            <button class="sw-btn reset" id="swReset" disabled>Reset</button>
            <button class="sw-btn start" id="swStartStop">Start</button>
            <button class="sw-btn lap" id="swLap" disabled>Lap</button>
          </div>
          <div class="lap-list" id="lapList"></div>
        </div>
      </section>

      <!-- TIMER TAB -->
      <section class="tab" id="timer">
        <div class="timer-container">
          <!-- Timer Setup -->
          <div class="timer-setup" id="timerSetup">
            <div class="timer-input-group">
              <div class="timer-col">
                <label for="timerHours">Hours</label>
                <div class="timer-input-wrap">
                  <button class="picker-arrow up" data-target="timerHours" data-dir="up">▲</button>
                  <input type="text" id="timerHours" value="00" maxlength="2" class="picker-input">
                  <button class="picker-arrow down" data-target="timerHours" data-dir="down">▼</button>
                </div>
              </div>
              <span class="picker-sep timer-sep">:</span>
              <div class="timer-col">
                <label for="timerMinutes">Minutes</label>
                <div class="timer-input-wrap">
                  <button class="picker-arrow up" data-target="timerMinutes" data-dir="up">▲</button>
                  <input type="text" id="timerMinutes" value="05" maxlength="2" class="picker-input">
                  <button class="picker-arrow down" data-target="timerMinutes" data-dir="down">▼</button>
                </div>
              </div>
              <span class="picker-sep timer-sep">:</span>
              <div class="timer-col">
                <label for="timerSeconds">Seconds</label>
                <div class="timer-input-wrap">
                  <button class="picker-arrow up" data-target="timerSeconds" data-dir="up">▲</button>
                  <input type="text" id="timerSeconds" value="00" maxlength="2" class="picker-input">
                  <button class="picker-arrow down" data-target="timerSeconds" data-dir="down">▼</button>
                </div>
              </div>
            </div>
            <div class="timer-presets">
              <button class="preset-btn" data-seconds="60">1 min</button>
              <button class="preset-btn" data-seconds="180">3 min</button>
              <button class="preset-btn" data-seconds="300">5 min</button>
              <button class="preset-btn" data-seconds="600">10 min</button>
              <button class="preset-btn" data-seconds="900">15 min</button>
              <button class="preset-btn" data-seconds="1800">30 min</button>
            </div>
            <button class="btn-start-timer" id="startTimerBtn">Start</button>
          </div>

          <!-- Timer Running -->
          <div class="timer-running hidden" id="timerRunning">
            <div class="timer-ring-container">
              <svg class="timer-ring" viewBox="0 0 200 200">
                <circle class="timer-ring-bg" cx="100" cy="100" r="90"/>
                <circle class="timer-ring-progress" cx="100" cy="100" r="90" id="timerProgress"/>
              </svg>
              <div class="timer-display" id="timerDisplay">05:00</div>
            </div>
            <div class="timer-controls">
              <button class="sw-btn reset" id="timerCancel">Cancel</button>
              <button class="sw-btn start" id="timerPauseResume">Pause</button>
            </div>
          </div>

          <!-- Timer Done -->
          <div class="timer-done hidden" id="timerDone">
            <div class="timer-done-icon">⏰</div>
            <h2>Time's Up!</h2>
            <button class="btn-dismiss" id="timerDismiss">Dismiss</button>
          </div>
        </div>
      </section>

      <!-- WORLD CLOCK TAB -->
      <section class="tab" id="worldclock">
        <div class="worldclock-container">
          <div class="wc-header">
            <h2>World Clock</h2>
            <button class="btn-add" id="addCityBtn" aria-label="Add city">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>
          <div class="wc-list" id="wcList"></div>
        </div>

        <!-- Add City Modal -->
        <div class="modal-overlay" id="cityModal">
          <div class="modal">
            <h3>Add City</h3>
            <input type="text" id="citySearch" placeholder="Search city or timezone..." class="city-search" autocomplete="off">
            <div class="city-results" id="cityResults"></div>
            <div class="modal-actions">
              <button class="btn-cancel" id="cancelCity">Cancel</button>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Global Alarm Ringing Overlay (visible from any active tab) -->
    <div class="alarm-ring-overlay" id="alarmRingOverlay" role="alertdialog" aria-live="assertive">
      <div class="alarm-ring-content">
        <div class="ring-icon">🔔</div>
        <h2 id="ringAlarmTime">07:00 AM</h2>
        <p id="ringAlarmLabel">Alarm</p>
        <div class="ring-actions">
          <button class="btn-snooze" id="snoozeBtn">Snooze (5 min)</button>
          <button class="btn-dismiss" id="dismissBtn">Dismiss</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
